[project]
name = "nyc-apartments-map"
version = "0.1.0"
description = "Modular pipeline that fetches NYC apartment datasets and renders an interactive Leaflet map."
readme = "README.md"
authors = [
    { name = "Gage Anderson", email = "gage@gageanderson.io" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "folium>=0.16",
    "branca>=0.7",
    "matplotlib>=3.8",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "commitizen>=4.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.scripts]
nyc-apartments-map = "nyc_apartments_map.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_apartments_map"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "branca.*", "folium", "geopandas", "geopandas.*", "shapely", "shapely.*", "matplotlib", "matplotlib.*", "yaml", "yaml.*", "fastapi", "fastapi.*", "starlette", "starlette.*", "uvicorn", "uvicorn.*", "httpx", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_provider = "commitizen"
update_changelog_on_bump = true
