# Apartment listing scorecard (0–100) for a single structured listing JSON.
#
# Read by src/apartment_scorer/score.py. Mirrors the philosophy of the
# repo-level weights.yaml: all tunable numbers live here; scoring logic
# lives in Python. Edit this file to retune the rubric without code changes.
#
# Category maxima must sum to 100. Points within a category are clamped to
# the category max so a generous mapping cannot overflow its budget.
#
# Dealbreakers do not zero the score: if any rule matches, the total is
# capped at `dealbreaker_cap` and the matched rule names are reported.

# --------------------------------------------------------------------------- #
# Category budgets (must sum to 100)
# --------------------------------------------------------------------------- #
category_max:
  location: 30
  unit_function: 30
  control: 15
  access: 15
  hygiene_outdoor: 7
  amenity_flags_score: 3

# Cap applied to the total when any dealbreaker matches.
dealbreaker_cap: 49

# --------------------------------------------------------------------------- #
# Location (max 30) — fixed score per neighborhood, from the scorecard bands:
#   25–30: Chelsea; Flatiron/Gramercy/Union Square north; selective WV/GV
#   18–24: Hell's Kitchen 8th–11th; Fort Greene/Boerum Hill/BK Heights edge;
#          unfashionable EV/LES blocks
#   10–17: Greenpoint / off-waterfront Williamsburg; UWS 60s–low 70s
#   0–9:   LIC, FiDi, UES, deep UWS, Bushwick as home, Jersey
# Keys are lowercase, punctuation-stripped names; aliases of a lookup name
# are all listed (score.py normalizes the input the same way).
# Unlisted neighborhoods fall back to `default` with a stderr warning.
# --------------------------------------------------------------------------- #
location:
  default: 10
  neighborhoods:
    # 25–30 band
    chelsea: 28
    west chelsea: 26
    flatiron: 27
    flatiron district: 27
    nomad: 27
    gramercy: 27
    gramercy park: 27
    union square north: 27
    west village: 26
    greenwich village: 26
    soho: 25
    # 18–24 band
    hells kitchen: 21
    clinton: 21
    hudson yards: 20
    hudson square: 20
    nolita: 19
    fort greene: 21
    boerum hill: 21
    brooklyn heights: 20
    east village: 19
    lower east side: 19
    les: 19
    # 10–17 band
    greenpoint: 14
    williamsburg: 13
    north williamsburg: 13
    upper west side: 13
    uws: 13
    astoria: 10
    clinton hill: 10
    prospect heights: 10
    downtown brooklyn: 9
    # 0–9 band
    long island city: 4
    lic: 4
    fidi: 4
    financial district: 4
    upper east side: 4
    ues: 4
    midtown east: 4
    murray hill: 4
    turtle bay: 4
    sutton place: 4
    deep upper west side: 3
    bushwick: 5
    hoboken: 3
    jersey city: 3

# --------------------------------------------------------------------------- #
# Unit function (max 30) — per-layout score, then demotion overrides:
#   - bed_in_sightline: cap at the sightline-cap band ("bed is the living
#     room" tour test — scored as a studio no matter the listing title).
#   - large_zoned_studio requires sqft >= studio_large_min_sqft, else it is
#     demoted to small_open_studio points.
#   - seats_four_without_bed == false: hosting fail, cap at
#     hosting_fail_cap.
# Overrides apply in order; each can only lower the score.
# --------------------------------------------------------------------------- #
unit_function:
  studio_large_min_sqft: 500
  sightline_cap: 14
  hosting_fail_cap: 14
  layouts:
    true_1br: 28
    alcove_1br: 26
    junior_1br: 26
    large_zoned_studio: 20
    small_open_studio: 7
    open_studio: 7
    railroad: 7
    fake_1br: 7

# --------------------------------------------------------------------------- #
# Control (max 15)
# --------------------------------------------------------------------------- #
control:
  situations:
    solo: 15
    known_roommate: 10
    new_roommates: 0

# --------------------------------------------------------------------------- #
# StreetEasy amenity enum -> scorer flags. Values are the exact
# SCREAMING_SNAKE_CASE strings from the listing payload's
# propertyDetails.amenities.list (JSON-LD amenityFeature uses the same names
# in snake_case; the scorer normalizes both sides, so either casing works).
# The batch normalizer flattens amenities.list + sharedOutdoorSpaceTypes +
# features.list + features.privateOutdoorSpaceTypes into `amenities`, so
# WASHER_DRYER / DISHWASHER / BALCONY / ... (unit features) map here too.
# A flag is true when ANY listed amenity is present in the listing's
# `amenities` array. Explicit boolean fields on the listing (e.g.
# laundry_in_building: true) override the derived flag.
# --------------------------------------------------------------------------- #
amenity_flags:
  laundry_in_building: [LAUNDRY]
  has_elevator: [ELEVATOR]
  has_doorman: [DOORMAN, CONCIERGE]
  has_gym: [GYM]
  has_roof_deck: [ROOF_DECK]
  has_shared_outdoor: [GARDEN, PATIO, SHARED_OUTDOOR_SPACE, COURTYARD]
  # unit features (from propertyDetails.features.list)
  has_washer_dryer: [WASHER_DRYER]
  has_dishwasher: [DISHWASHER]
  has_central_ac: [CENTRAL_AC]
  has_private_outdoor: [PRIVATE_OUTDOOR_SPACE, BALCONY, TERRACE, PRIVATE_ROOF_DECK]
  # building extras
  has_package_room: [PACKAGE_ROOM]
  has_bike_room: [BIKE_ROOM]
  has_storage: [STORAGE_SPACE]
  has_parking: [PARKING]
  has_pool: [POOL]
  # trophy stack -> amenity_trap heuristic (see building_class.trophy_trap)
  trophy_pool: [POOL, HOT_TUB]
  trophy_media: [MEDIA_ROOM]
  trophy_playroom: [CHILDRENS_PLAYROOM]
  trophy_valet: [VALET_SERVICE]

# Heuristic for `effective_building_class` (drives the LIC/DTBK tower
# dealbreaker). `luxury_tower` requires: building floor count >= min_floors,
# year built >= min_year, and ALL of the required amenity flags present.
# Buildings with an elevator that fail the tower test are `elevator_building`;
# no elevator + known floor count is `walkup`; otherwise `unknown`.
building_class:
  luxury_tower:
    min_floors: 20
    min_year: 1990
    require_flags: [has_doorman, has_gym]
  # Derives `amenity_trap` (caps hygiene_outdoor) from the trophy stack:
  # fires when >= min_amenities trophy_* flags are present AND any of
  # require_any_flags is also present. Explicit amenity_trap on a listing wins.
  trophy_trap:
    min_amenities: 3
    require_any_flags: [trophy_pool, trophy_valet]

# Minimum distinct transit routes (union of `transit_stations[].routes`)
# that counts as "multiple lines" for access points.
transit_min_distinct_routes: 2

# --------------------------------------------------------------------------- #
# Access (max 15) — additive points, clamped to the category max.
# elevator_or_low_walkup: has_elevator flag, or a parsed unit floor <= 3.
# multi_line_or_walk_anchor: distinct transit routes >= the minimum above,
# or the manual walk_to_work_anchor flag.
# --------------------------------------------------------------------------- #
access:
  points:
    elevator_or_low_walkup: 6
    multi_line_or_walk_anchor: 5
    laundry_in_building: 4

# --------------------------------------------------------------------------- #
# Hygiene / outdoor (max 7) — additive points, clamped to the category max.
# amenity_trap (trophy finishes, sliver balcony, unbookable roof, gym you'll
# ignore) caps the whole category at amenity_trap_cap.
# packages_safe is derived from the has_doorman flag (override with an
# explicit packages_safe boolean; a VIRTUAL doorman sets it false). The
# usable-balcony signal is driven by has_private_outdoor (real private
# outdoor space), falling back to the weaker shared has_roof_deck flag.
# --------------------------------------------------------------------------- #
hygiene_outdoor:
  amenity_trap_cap: 5
  points:
    quiet_enough_to_sleep: 3
    packages_safe: 2
    usable_balcony_or_bookable_roof: 3

# --------------------------------------------------------------------------- #
# Amenity flags (max 3) — small binary add-ons for the parsed building/unit
# feature set. Each key is a derived flag name (see amenity_flags); the value
# is the points earned when the flag is true. Keep these at 1 apiece — they
# are presence signals layered on top of the main categories.
# --------------------------------------------------------------------------- #
amenity_flags_score:
  points:
    has_washer_dryer: 1
    has_dishwasher: 1
    has_central_ac: 1
    has_private_outdoor: 1
    has_package_room: 1
    has_bike_room: 1
    has_storage: 1
    has_parking: 1
    has_pool: 1

# --------------------------------------------------------------------------- #
# Dealbreakers — each rule matches when every `when` condition holds.
# `when` values may be scalars (exact match) or lists (match any).
# `min`/`max` on a numeric field compare inclusively.
# --------------------------------------------------------------------------- #
dealbreakers:
  - name: two_plus_new_roommates
    when:
      living_situation: new_roommates
  - name: bed_in_sightline_open_studio
    when:
      bed_in_sightline: true
      layout: [small_open_studio, open_studio]
  - name: lounge_roof_as_party_apartment
    when:
      relying_on_common_space: true
  - name: lic_or_downtown_brooklyn_tower_plan
    when:
      neighborhood: [long island city, lic, downtown brooklyn]
      effective_building_class: luxury_tower
  - name: midtown_east_identity_move
    when:
      neighborhood: [midtown east, murray hill, turtle bay, sutton place]
  - name: thousand_dollar_amenity_premium
    when:
      amenity_premium_over_comps: {min: 1000}
  - name: five_flight_walkup_hosting
    # unit_floor is parsed from the `unit` string (e.g. "#18A" -> 18);
    # an explicit `unit_floor` number on the listing wins.
    when:
      unit_floor: {min: 5}
      has_elevator: false
      intends_to_host: true
  - name: stale_listing_negotiate_hard
    # sitting on the market: leverage signal, not a hard stop
    when:
      days_on_market: {min: 60}
  - name: furnished_when_you_own_furniture
    when:
      furnished: true
  - name: price_dropped_motivated_landlord
    when:
      price_dropped: true
